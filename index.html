<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071c34">
  <meta name="description" content="Coming from the ocean soon">
  <title>Coming from the ocean soon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f6faf9;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(32, 144, 161, .43), transparent 52%),
        linear-gradient(165deg, #071c34 0%, #0a3551 48%, #0e697a 100%);
      font-family: Georgia, 'Times New Roman', serif;
    }
    body::before, body::after {
      content: '';
      position: fixed;
      inset: auto -15% -22vh;
      height: 45vh;
      border-radius: 50% 50% 0 0;
      pointer-events: none;
    }
    body::before { background: rgba(87, 202, 204, .12); transform: rotate(-5deg); }
    body::after { background: rgba(4, 32, 59, .24); transform: rotate(6deg) translateY(7vh); }
    main { position: relative; z-index: 1; padding: 2rem; text-align: center; }
    h1 { margin: 0; max-width: 18ch; font-size: clamp(3rem, 9vw, 7.5rem); font-weight: 400; line-height: 1.05; letter-spacing: -.045em; text-wrap: balance; }
    .rule { width: 5rem; height: 1px; margin: 2.5rem auto 0; background: #a4dfd9; opacity: .85; }
  </style>
</head>
<body>
  <main>
    <h1>Coming from the ocean soon</h1>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
